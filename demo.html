<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>莫斯科公交查询 - 演示页面</title>
  <style>
    :root {
      --primary: #0A84FF;
      --primary-weak: rgba(10, 132, 255, 0.16);
      --surface: #FFFFFF;
      --surface-muted: rgba(255, 255, 255, 0.82);
      --text-primary: #1B1C1F;
      --text-secondary: rgba(27, 28, 31, 0.65);
      --text-tertiary: rgba(27, 28, 31, 0.4);
      --danger: #FF453A;
      --border: rgba(15, 23, 42, 0.08);
      --shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      background: radial-gradient(circle at top, #FDFEFF 0%, #F3F5FA 55%, #E8ECF4 100%);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 12px;
    }

    .phone-frame {
      width: 100%;
      max-width: 428px;
      border-radius: 48px;
      background: #0F172A;
      padding: 4px;
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.35);
    }

    .phone-inner {
      background: linear-gradient(180deg, #FDFEFF 0%, #EEF1F7 100%);
      border-radius: 44px;
      overflow: hidden;
      min-height: 820px;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 15px;
      font-weight: 600;
      color: #111827;
    }

    .app-header {
      padding: 0 32px 24px;
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .app-container {
      flex: 1;
      padding: 0 28px 32px;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .glass-card {
      background: var(--surface-muted);
      border-radius: 36px;
      padding: 32px;
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: var(--shadow);
      color: #fff;
    }

    .card {
      background: var(--surface);
      border-radius: 32px;
      padding: 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .hero-card {
      background-image: linear-gradient(135deg, #0A84FF, #66A6FF 65%, #70D6FF);
      margin-bottom: 28px;
    }

    .hero-badge {
      display: inline-flex;
      padding: 8px 28px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 6px;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.15);
      margin-bottom: 14px;
    }

    .hero-title {
      font-size: 34px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .hero-cta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 28px;
      padding: 20px 24px;
      background: rgba(255, 255, 255, 0.18);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
    }

    .hero-cta span:last-child {
      font-size: 26px;
      opacity: 0.8;
    }

    .status-chip {
      margin-bottom: 24px;
      padding: 18px;
      background: rgba(10, 132, 255, 0.08);
      color: var(--primary);
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid rgba(10, 132, 255, 0.2);
      text-align: center;
    }

    .section-block {
      margin-top: 32px;
    }

    .section-heading {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .favorite-list,
    .history-list,
    .result-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .favorite-card,
    .list-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 24px;
      border-radius: 28px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    .favorite-card:active,
    .list-card:active {
      transform: scale(0.98);
      transition: transform 0.15s ease;
    }

    .list-icon {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    .list-info {
      flex: 1;
      min-width: 0;
    }

    .list-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .list-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-arrow {
      font-size: 24px;
      color: var(--text-tertiary);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      padding: 60px 20px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px dashed rgba(15, 23, 42, 0.08);
    }

    .empty-icon {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: rgba(10, 132, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: var(--primary);
    }

    .empty-text {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .empty-hint {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 15px 30px rgba(10, 132, 255, 0.35);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .search-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .search-field {
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 28px;
      padding: 16px 20px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.95);
      margin-bottom: 20px;
    }

    .search-field input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 16px;
      color: var(--text-primary);
      outline: none;
    }

    .clear-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
    }

    .search-btn {
      width: 72px;
      height: 60px;
      border-radius: 22px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      border: none;
      box-shadow: 0 12px 24px rgba(10, 132, 255, 0.3);
      cursor: pointer;
    }

    .history-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.06);
      font-size: 14px;
    }

    .tips-card {
      margin-top: 16px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.7);
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .tips-card .tip-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .tips-card .tip-item {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.8;
    }

    .stop-card {
      background-image: linear-gradient(135deg, #0A84FF, #66A6FF 65%, #70D6FF);
      color: #fff;
      margin-bottom: 24px;
    }

    .stop-header {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 12px;
    }

    .stop-icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .favorite-toggle {
      margin-left: auto;
      font-size: 32px;
      cursor: pointer;
    }

    .stop-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
    }

    .refresh-pill {
      padding: 10px 20px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.2);
    }

    .arrival-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-radius: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .route-info {
      max-width: 70%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .route-number {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .route-name {
      font-size: 14px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arrival-times {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .arrival-chip {
      min-width: 82px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.04);
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .arrival-chip:first-child {
      background: rgba(10, 132, 255, 0.12);
      color: var(--primary);
      box-shadow: 0 10px 22px rgba(10, 132, 255, 0.16);
    }

    .arrival-minute {
      font-size: 20px;
      line-height: 1;
    }

    .arrival-unit {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .arrival-empty {
      font-size: 14px;
      color: var(--text-tertiary);
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 60px 20px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid rgba(10, 132, 255, 0.15);
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .update-time {
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 12px;
    }

    .tab-bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 18px 32px;
      border-top: 1px solid rgba(15, 23, 42, 0.08);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(24px);
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-tertiary);
      cursor: pointer;
    }

    .tab-item.active {
      color: var(--primary);
      font-weight: 600;
    }

    .tab-icon {
      font-size: 22px;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-inner">
      <div class="status-bar">
        <span id="statusTime">9:41</span>
        <span>📶 🔋</span>
      </div>
      <div class="app-header">🚌 莫斯科公交</div>

      <div class="app-container" id="app">
        <div id="homeView">
          <div class="hero-card glass-card">
            <div class="hero-badge">BUSTIME</div>
            <div class="hero-title">莫斯科公交</div>
            <div class="hero-cta" onclick="showSearchView()">
              <span>⌕ 搜索站点</span>
              <span>›</span>
            </div>
          </div>

          <div class="status-chip" id="apiStatus">
            ✅ 后端服务运行正常
          </div>

          <div class="section-block">
            <div class="section-heading">我的收藏</div>
            <div id="favoritesList" class="favorite-list">
              <div class="empty-state">
                <div class="empty-icon">⭐</div>
                <div class="empty-text">还没有收藏任何站点</div>
                <div class="empty-hint">在站点详情页点击星标即可收藏</div>
                <button class="btn btn-primary" onclick="showSearchView()">去搜索</button>
              </div>
            </div>
          </div>
        </div>

        <div id="searchView" style="display: none;">
          <div class="search-top">
            <button class="btn btn-ghost" onclick="showHomeView()">⌦ 返回</button>
          </div>
          <div class="search-field">
            <span class="list-icon" style="background: rgba(10, 132, 255, 0.12); color: var(--primary);">🔍</span>
            <input type="text" id="searchInput" placeholder="输入站点名称..." onkeyup="performSearch(event)">
            <div class="clear-btn" onclick="document.getElementById('searchInput').value=''; performSearch({target:{value:''}});">×</div>
          </div>
          <div class="section-block" id="frequentStops"></div>
          <div id="searchResults" class="result-list"></div>
          <div id="searchLoading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <div>由于技术原因，这里要施法 30 秒，请耐心等候...</div>
          </div>
          <div class="tips-card">
            <div class="tip-title">搜索提示</div>
            <div class="tip-item">• 至少输入 2 个字符</div>
            <div class="tip-item">• 输入站点附近地标也可</div>
          </div>
        </div>

        <div id="detailView" style="display: none;">
          <div class="stop-card glass-card">
            <div class="stop-header">
              <div class="stop-icon">📍</div>
              <div class="stop-info">
                <div class="stop-name" id="detailStopName">-</div>
                <div class="stop-address" id="detailStopAddress">-</div>
              </div>
              <div class="favorite-toggle" onclick="toggleFavorite()">☆</div>
            </div>
            <div class="stop-footer">
              <div class="update-info">
                <span>🕐</span>
                <span id="updateTime">等待刷新...</span>
              </div>
              <div class="refresh-pill" onclick="loadStopDetail(currentStopId)">刷新</div>
            </div>
          </div>

          <div class="section-heading">即将到站</div>
          <div id="arrivalsList"></div>
        </div>
      </div>

      <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab('home', event)">
            <span class="tab-icon">🏠</span>
            <span>首页</span>
        </div>
        <div class="tab-item" onclick="switchTab('favorites', event)">
            <span class="tab-icon">⭐</span>
            <span>收藏</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000';
    let currentView = 'home';
    let currentStopId = null;

    async function checkAPIStatus() {
      try {
        const res = await fetch(`${API_BASE}/health`);
        const data = await res.json();
        document.getElementById('apiStatus').innerHTML =
          `✅ 后端服务运行正常 · 运行 ${Math.floor(data.uptime)} 秒`;
      } catch (error) {
        const status = document.getElementById('apiStatus');
        status.innerHTML = '❌ 无法连接到后端服务';
        status.style.background = 'rgba(255, 69, 58, 0.12)';
        status.style.color = varDanger();
      }
    }

    function varDanger() {
      return getComputedStyle(document.documentElement).getPropertyValue('--danger') || '#FF453A';
    }

    function switchTab(tab, evt) {
      const tabs = document.querySelectorAll('.tab-item');
      tabs.forEach(t => t.classList.remove('active'));
      evt.currentTarget.classList.add('active');
      if (tab === 'home') {
        showHomeView();
        return;
      }

      alert('收藏管理请在首页完成');
      tabs[0].classList.add('active');
      evt.currentTarget.classList.remove('active');
      showHomeView();
    }

    function showHomeView() {
      document.getElementById('homeView').style.display = 'block';
      document.getElementById('searchView').style.display = 'none';
      document.getElementById('detailView').style.display = 'none';
      currentView = 'home';
    }

    function showSearchView() {
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('searchView').style.display = 'block';
      document.getElementById('detailView').style.display = 'none';
      currentView = 'search';
      loadFrequentStops();
      setTimeout(() => document.getElementById('searchInput').focus(), 120);
    }

    async function loadFrequentStops() {
      try {
        const res = await fetch(`${API_BASE}/api/frequent-stops`);
        const data = await res.json();
        if (data.success && data.data.length > 0) {
          let html = '<div class="section-heading">常用站点</div>';
          data.data.forEach(stop => {
            html += `
              <div class="list-card" onclick='showDetailView(${JSON.stringify(stop)})'>
                <div class="list-icon">⭐</div>
                <div class="list-info">
                  <div class="list-title">${stop.name}</div>
                  <div class="list-subtitle">${stop.address || ''}</div>
                </div>
                <div class="list-arrow">›</div>
              </div>
            `;
          });
          document.getElementById('frequentStops').innerHTML = html;
        } else {
          document.getElementById('frequentStops').innerHTML = '';
        }
      } catch (error) {
        console.error('加载常用站点失败:', error);
        document.getElementById('frequentStops').innerHTML = '';
      }
    }

    function showDetailView(stop) {
      currentStopId = stop.id;
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('searchView').style.display = 'none';
      document.getElementById('detailView').style.display = 'block';
      currentView = 'detail';

      document.getElementById('detailStopName').textContent = stop.name;
      document.getElementById('detailStopAddress').textContent = stop.address || '';
      loadStopDetail(stop.id);
    }

    let searchTimeout;
    async function performSearch(event) {
      const keyword = event.target.value.trim();
      if (keyword.length < 2) {
        document.getElementById('searchResults').innerHTML = '';
        document.getElementById('frequentStops').style.display = 'block';
        return;
      }

      document.getElementById('frequentStops').style.display = 'none';
      clearTimeout(searchTimeout);

      searchTimeout = setTimeout(async () => {
        document.getElementById('searchLoading').style.display = 'flex';
        document.getElementById('searchResults').innerHTML = '';
        try {
          const res = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(keyword)}`);
          const data = await res.json();
          document.getElementById('searchLoading').style.display = 'none';
          if (data.success && data.data.length > 0) {
            let html = '<div class="section-heading">搜索结果</div>';
            data.data.forEach(stop => {
              html += `
                <div class="list-card" onclick='showDetailView(${JSON.stringify(stop)})'>
                  <div class="list-icon">📍</div>
                  <div class="list-info">
                    <div class="list-title">${stop.name}</div>
                    <div class="list-subtitle">${stop.address || ''}</div>
                  </div>
                  <div class="list-arrow">›</div>
                </div>
              `;
            });
            document.getElementById('searchResults').innerHTML = html;
          } else {
            document.getElementById('searchResults').innerHTML = `
              <div class="empty-state">
                <div class="empty-icon">🔍</div>
                <div class="empty-text">未找到相关站点</div>
                <div class="empty-hint">尝试缩短或更换关键词</div>
              </div>
            `;
          }
        } catch (error) {
          document.getElementById('searchLoading').style.display = 'none';
          document.getElementById('searchResults').innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">⚠️</div>
              <div class="empty-text">搜索失败</div>
              <div class="empty-hint">${error.message}</div>
            </div>
          `;
        }
      }, 400);
    }

    async function loadStopDetail(stopId) {
      document.getElementById('arrivalsList').innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <div>由于技术原因，这里要施法 30 秒，请耐心等候...</div>
        </div>
      `;

      try {
        const res = await fetch(`${API_BASE}/api/stop/${stopId}`);
        const data = await res.json();

        if (data.success && data.data.arrivals) {
          let html = '';
          if (data.data.arrivals.length === 0) {
            html = `
              <div class="empty-state">
                <div class="empty-icon">🚌</div>
                <div class="empty-text">暂无到站信息</div>
                <div class="empty-hint">稍后再试或刷新数据</div>
              </div>
            `;
          } else {
            data.data.arrivals.forEach(route => {
              const topArrivals = (route.arrivals || []).slice(0, 3);
              const timesHtml = topArrivals.length
                ? `
                  <div class="arrival-times">
                    ${topArrivals.map(arrival => {
                      const imminent = arrival.minutes === 0;
                      return `
                        <div class="arrival-chip">
                          <span class="arrival-minute">${imminent ? '即将' : arrival.minutes}</span>
                          ${imminent ? '' : '<span class="arrival-unit">分钟</span>'}
                        </div>
                      `;
                    }).join('')}
                  </div>
                `
                : `<div class="arrival-empty">暂无</div>`;

              html += `
                <div class="arrival-row">
                  <div class="route-info">
                    <div class="route-number">${route.routeNumber || 'N/A'}</div>
                    ${route.routeName ? `<div class="route-name">${route.routeName}</div>` : ''}
                  </div>
                  ${timesHtml}
                </div>
              `;
            });
          }
          document.getElementById('arrivalsList').innerHTML = html;
          const updateTime = new Date(data.data.updateTime).toLocaleTimeString('zh-CN');
          document.getElementById('updateTime').textContent = `更新时间：${updateTime}`;
        } else {
          throw new Error(data.message || '获取数据失败');
        }
      } catch (error) {
        document.getElementById('arrivalsList').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <div class="empty-text">加载失败</div>
            <div class="empty-hint">${error.message}</div>
            <button class="btn btn-primary" onclick="loadStopDetail('${stopId}')">重试</button>
          </div>
        `;
      }
    }

    function toggleFavorite() {
      alert('收藏功能请在微信小程序中体验');
    }

    function updateStatusBarTime() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('statusTime').textContent = `${hours}:${minutes}`;
    }

    updateStatusBarTime();
    setInterval(updateStatusBarTime, 60000);
    checkAPIStatus();
    setInterval(checkAPIStatus, 10000);
  </script>
</body>
</html>
